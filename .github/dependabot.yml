# GitHub Actions and the Dockerfile's base images, weekly. Gems are left out
# on purpose: a gem bump belongs in a commit that also updates Gemfile.lock and
# passes make test, made by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  # The base images are pinned by tag and digest. A new Ruby 4 patch release,
  # or a rebuilt image under the same tag (an Alpine security fix), arrives as
  # a pull request that CI tests like any other change. Ruby's major version
  # is the project's decision, not the bot's. CI fails until .ruby-version
  # moves with the image, so tests and image keep running the same Ruby.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    ignore:
      - dependency-name: ruby
        update-types: ["version-update:semver-major"]
